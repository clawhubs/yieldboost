[project]
name = "yieldboost-integrity-api"
version = "0.1.0"
description = "API-first 10-layer Integrity service for YieldBoost AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.31.0",
  "cryptography>=43.0.0",
  "e2b-code-interpreter>=1.5.0",
  "eth-account>=0.13.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "pytest>=8.4.0",
  "python-multipart>=0.0.27",
  "uvicorn[standard]>=0.32.0",
  "web3>=6.20.0",
]

[tool.uvicorn]
factory = false
host = "0.0.0.0"
port = 8010
